name: Sync Daily ETF & Dividend Data

on:
  schedule:
    # 매주 화~토 한국 시간(KST) 오전 7:00 (UTC 22:00 월~금) - 뉴욕 증시 마감 직후
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # GitHub 웹 콘솔에서 수동으로 'Run workflow' 가능

jobs:
  sync-etf:
    name: Sync Yahoo Finance ETF Data to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ETF Data Synchronization
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:etf
